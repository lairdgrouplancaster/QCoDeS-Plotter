<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">SQLite write-ahead log companion icon</title>
  <desc id="description">A folded-page companion with a red first log line, two dark-grey log lines and a WAL badge. Original editable vector artwork. No fonts or linked images.</desc>
  <g id="Document">
    <path id="Paper" fill="#FFFFFF" stroke="#555656" stroke-width="10"
          stroke-linejoin="round"
          d="M112 40 H336 L424 128 V448
             C424 461.255 413.255 472 400 472 H112
             C98.745 472 88 461.255 88 448 V64
             C88 50.745 98.745 40 112 40 Z"/>
    <path id="Fold" fill="#E5E6E7" stroke="#555656" stroke-width="10"
          stroke-linejoin="round"
          d="M336 40 V104 C336 117.255 346.745 128 360 128 H424 Z"/>
  </g>

  <g id="Log-lines" fill="none" stroke="#555656" stroke-width="16" stroke-linecap="round">
    <path id="First-entry" stroke="#B5121B" d="M164 218 H346"/>
    <path id="Second-entry" d="M164 264 H346"/>
    <path id="Third-entry" d="M164 310 H294"/>
  </g>
  <g id="WAL-badge">
    <rect x="254" y="386" width="190" height="76" rx="16"
          fill="#555656" stroke="#FFFFFF" stroke-width="8"/>
    <g id="Badge-lettering" fill="none" stroke="#FFFFFF" stroke-width="6"
       stroke-linecap="round" stroke-linejoin="round">
      <path id="Letter-1-W" transform="translate(281 408)" d="M0 0 L8 32 L17 10 L26 32 L34 0"/>
      <path id="Letter-2-A" transform="translate(327 408)" d="M0 32 L16 0 L32 32 M7 21 H25"/>
      <path id="Letter-3-L" transform="translate(373 408)" d="M0 0 V32 H28"/>
    </g>
  </g>
</svg>
