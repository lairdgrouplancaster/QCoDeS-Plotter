<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
     viewBox="0 0 16 16" role="img" aria-labelledby="title description">
  <title id="title">SQLite write-ahead log icon at 16 pixels</title>
  <desc id="description">A log-line symbol with a red first line replaces the letter badge at small sizes. Original editable vector artwork. No fonts or linked images.</desc>
  <g id="Document">
    <path id="Paper" fill="#FFFFFF" stroke="#555656" stroke-width="1"
          stroke-linejoin="round"
          d="M4 1.5 H10.5 L13.5 4.5 V14
             Q13.5 14.5 13 14.5 H4 Q3.5 14.5 3.5 14 V2
             Q3.5 1.5 4 1.5 Z"/>
    <path id="Fold" fill="#E5E6E7" stroke="#555656" stroke-width="1"
          stroke-linejoin="round" d="M10.5 1.5 V4.5 H13.5 Z"/>
  </g>
  <g id="Log-lines" fill="none" stroke="#555656" stroke-width="1" stroke-linecap="round">
    <path id="First-entry" stroke="#B5121B" d="M6.2 7.5 H11"/>
    <path d="M6.2 9 H11 M6.2 10.5 H9.8"/>
  </g>
</svg>
