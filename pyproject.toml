[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qplot"
version = "1.5.0b2"
description = "PyQt-based viewer for completed and running QCoDeS database experiments"
readme = "README.md"
authors = [{name="Ben Wordsworth", email="b.wordsworth@lancaster.ac.uk"},{name="Edward Laird", email="e.a.laird@lancaster.ac.uk"}]
license = "MIT"
requires-python = ">=3.11"
keywords = ["qcodes", "pyqt", "pyqtgraph", "data-visualization", "scientific-computing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "jsonschema>=4.23.0",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "PyQt6>=6.8.0",
    "pyqtgraph>=0.14.0",
    "qcodes>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.14,<2.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "twine>=5.0",
]

[project.scripts]
qplot = "qplot.__main__:run"
qplot-cfg = "qplot.configuration.scripts:scripts"

[project.urls]
Homepage = "https://github.com/lairdgrouplancaster/QCoDeS-Plotter.git"
Source = "https://github.com/lairdgrouplancaster/QCoDeS-Plotter"
Issues = "https://github.com/lairdgrouplancaster/QCoDeS-Plotter/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qplot" = ["**/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --cov=qplot --cov-report=term-missing:skip-covered --cov-report=xml"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qplot"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["F", "B", "I", "UP"]

[tool.mypy]
check_untyped_defs = true
follow_imports = "silent"
files = [
    "src/qplot/__init__.py",
    "src/qplot/__main__.py",
    "src/qplot/_metadata.py",
    "src/qplot/_repair.py",
    "src/qplot/_version.py",
    "src/qplot/configuration/__init__.py",
    "src/qplot/configuration/config.py",
    "src/qplot/configuration/scripts.py",
    "src/qplot/configuration/themes/__init__.py",
    "src/qplot/configuration/themes/_base.py",
    "src/qplot/configuration/themes/blank.py",
    "src/qplot/configuration/themes/dark.py",
    "src/qplot/configuration/themes/light.py",
    "src/qplot/datahandling/__init__.py",
    "src/qplot/datahandling/LoadFromDB.py",
    "src/qplot/datahandling/qcodes_cache.py",
    "src/qplot/datahandling/readSQL.py",
    "src/qplot/datahandling/readonly.py",
    "src/qplot/diagnostics.py",
    "src/qplot/tools/__init__.py",
    "src/qplot/tools/general.py",
    "src/qplot/tools/heatmap_geometry.py",
    "src/qplot/tools/operation_registry.py",
    "src/qplot/tools/plot_tools.py",
    "src/qplot/tools/worker.py",
    "src/qplot/windows/__init__.py",
    "src/qplot/windows/_commands.py",
    "src/qplot/windows/main.py",
    "src/qplot/windows/_colorbar.py",
    "src/qplot/windows/_dataset_handle.py",
    "src/qplot/windows/_dragdrop.py",
    "src/qplot/windows/_help.py",
    "src/qplot/windows/_plot1d_snap.py",
    "src/qplot/windows/_plot1d_traces.py",
    "src/qplot/windows/_plot2d_colorbar.py",
    "src/qplot/windows/_plot2d_colorbar_dialog.py",
    "src/qplot/windows/_plot2d_sweeps.py",
    "src/qplot/windows/_plot_axis_scaling.py",
    "src/qplot/windows/_plot_export.py",
    "src/qplot/windows/_plot_feedback.py",
    "src/qplot/windows/_plot_marquee.py",
    "src/qplot/windows/_plot_refresh.py",
    "src/qplot/windows/_plot_state.py",
    "src/qplot/windows/_preferences.py",
    "src/qplot/windows/_shortcuts.py",
    "src/qplot/windows/_window_controls.py",
    "src/qplot/windows/_subplots/__init__.py",
    "src/qplot/windows/_subplots/subplot1d.py",
    "src/qplot/windows/_subplots/subplot2d.py",
    "src/qplot/windows/_widgets/__init__.py",
    "src/qplot/windows/plot1d.py",
    "src/qplot/windows/plot2d.py",
    "src/qplot/windows/_widgets/_run_formatting.py",
    "src/qplot/windows/_widgets/details_tables.py",
    "src/qplot/windows/_widgets/dropbox.py",
    "src/qplot/windows/_widgets/operations.py",
    "src/qplot/windows/_widgets/preview.py",
    "src/qplot/windows/_widgets/run_list_items.py",
    "src/qplot/windows/_widgets/toolbar.py",
    "src/qplot/windows/_widgets/treeWidgets.py",
]
ignore_missing_imports = true
no_implicit_optional = true
sqlite_cache = false
warn_unused_ignores = true
