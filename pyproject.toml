[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "qplotter"
version = "1.7.0"
description = "PyQt-based viewer for completed and running QCoDeS database experiments"
readme = "README.md"
authors = [{name="Ben Wordsworth", email="b.wordsworth@lancaster.ac.uk"},{name="Edward Laird", email="e.a.laird@lancaster.ac.uk"}]
license = "MIT"
requires-python = ">=3.12"
keywords = ["qcodes", "pyqt", "pyqtgraph", "data-visualization", "scientific-computing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "qplotter-native==1.0.1",
    "apsw==3.53.4.0",
    "jsonschema>=4.23.0",
    "numpy>=2.3.1",
    "packaging>=23.0",
    "pandas>=2.3.0",
    "PyQt6>=6.9.0",
    "pyqtgraph>=0.14.0",
    "qcodes>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.14,<2.0",
    "pillow>=11.0",
    "pytest>=8.2",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.8",
    "ruff>=0.8",
    "twine>=5.0",
]

[project.scripts]
qplot = "qplot.__main__:run"
qplot-cfg = "qplot.configuration.scripts:scripts"
qplot-generate-db = "qplot.testdata:main"

[project.urls]
Homepage = "https://github.com/lairdgrouplancaster/QCoDeS-Plotter.git"
Source = "https://github.com/lairdgrouplancaster/QCoDeS-Plotter"
Issues = "https://github.com/lairdgrouplancaster/QCoDeS-Plotter/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["qplot", "qplot.*"]

[tool.setuptools.package-data]
"qplot" = ["**/*.csv", "**/*.json", "assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.icns"]

[tool.setuptools.exclude-package-data]
"qplot.datahandling" = ["*.c", "*.h", "**/*.c", "**/*.h"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "pure: audited unit tests that need neither Qt initialization nor database fixtures",
]

[tool.coverage.run]
branch = true
source = ["qplot"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["F", "B", "I", "UP"]
# Keep existing runtime type aliases and generics. Raising the Python minimum
# enables these PEP 695 rewrites, whose runtime semantics differ from typing.
ignore = ["UP040", "UP046"]

