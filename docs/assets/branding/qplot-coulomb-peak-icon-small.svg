<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="16" height="16" viewBox="0 0 16 16"
     role="img" aria-labelledby="title description">
  <title id="title">qPlot Coulomb peak document icon</title>
  <desc id="description">A Lancaster-red, symmetric thermally broadened Coulomb peak inside a white document with a dark-grey outline. The curve approximates a scaled sech-squared profile using editable cubic Bezier segments. Original qPlot vector artwork with no fonts or linked images, adjusted for 16-pixel display.</desc>

  <!-- Palette reference:
       https://www.lancaster.ac.uk/external-relations/marketing-office/brand/visual-identity/colours/
       Peak: Lancaster red #B5121B. Outline: dark grey #555656.
       Paper: white #FFFFFF. Axes: pale grey #BEC0C2.
       Fold: 40% pale grey tint #E5E6E7. -->

  <g id="Document">
    <path id="Paper" fill="#FFFFFF" stroke="#555656" stroke-width="1"
          stroke-linejoin="round"
          d="M4 1.5 H10.5 L13.5 4.5 V14
             Q13.5 14.5 13 14.5 H4 Q3.5 14.5 3.5 14 V2
             Q3.5 1.5 4 1.5 Z"/>
    <path id="Fold" fill="#E5E6E7" stroke="#555656" stroke-width="1"
          stroke-linejoin="round" d="M10.5 1.5 V4.5 H13.5 Z"/>
  </g>
  <g id="Plot">
    <path id="Axes" fill="none" stroke="#BEC0C2" stroke-width="1"
          stroke-linecap="round" stroke-linejoin="round"
          d="M5.5 6 V12.5 H11.5"/>
    <!-- Thermally broadened peak: y = baseline - amplitude / cosh(u)^2.
         Smooth cubic segments retain editable handles in Illustrator. -->
    <path id="Coulomb-peak" fill="none" stroke="#B5121B"
          stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"
          d="M6.8000 10.7307
             C6.9111 10.7236 7.0222 10.7131 7.1334 10.6917
             C7.2445 10.6703 7.3555 10.6387 7.4666 10.5756
             C7.5778 10.5125 7.6889 10.4188 7.8000 10.2445
             C7.9111 10.0701 8.0222 9.8087 8.1334 9.4092
             C8.2445 9.0097 8.3555 8.4472 8.4666 7.9178
             C8.5778 7.3885 8.6889 6.9500 8.8000 6.9500
             C8.9111 6.9500 9.0222 7.3885 9.1334 7.9178
             C9.2445 8.4472 9.3555 9.0097 9.4666 9.4092
             C9.5778 9.8087 9.6889 10.0701 9.8000 10.2445
             C9.9111 10.4188 10.0222 10.5125 10.1334 10.5756
             C10.2445 10.6387 10.3555 10.6703 10.4666 10.6917
             C10.5778 10.7131 10.6889 10.7236 10.8000 10.7307"/>
  </g>
</svg>
