<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">SQLite shared-memory index companion icon</title>
  <desc id="description">A folded-page companion with connected blocks, a red upper-left block outline and a SHM badge. Original editable vector artwork. No fonts or linked images.</desc>
  <g id="Document">
    <path id="Paper" fill="#FFFFFF" stroke="#555656" stroke-width="10"
          stroke-linejoin="round"
          d="M112 40 H336 L424 128 V448
             C424 461.255 413.255 472 400 472 H112
             C98.745 472 88 461.255 88 448 V64
             C88 50.745 98.745 40 112 40 Z"/>
    <path id="Fold" fill="#E5E6E7" stroke="#555656" stroke-width="10"
          stroke-linejoin="round"
          d="M336 40 V104 C336 117.255 346.745 128 360 128 H424 Z"/>
  </g>

  <g id="Shared-blocks" stroke="#555656" stroke-width="14" stroke-linejoin="round">
    <path id="Connection" d="M232 252 H264 V318 H280" fill="none"/>
    <rect id="First-block" x="160" y="216" width="72" height="72" rx="12" fill="#E5E6E7" stroke="#B5121B"/>
    <rect id="Second-block" x="280" y="282" width="72" height="72" rx="12" fill="#E5E6E7"/>
  </g>
  <g id="SHM-badge">
    <rect x="254" y="386" width="190" height="76" rx="16"
          fill="#555656" stroke="#FFFFFF" stroke-width="8"/>
    <g id="Badge-lettering" fill="none" stroke="#FFFFFF" stroke-width="6"
       stroke-linecap="round" stroke-linejoin="round">
      <path id="Letter-1-S" transform="translate(281 408)" d="M29 4 C23 -1 6 -1 2 7 C-3 20 32 12 30 25 C28 35 8 36 0 29"/>
      <path id="Letter-2-H" transform="translate(327 408)" d="M0 0 V32 M30 0 V32 M0 16 H30"/>
      <path id="Letter-3-M" transform="translate(373 408)" d="M0 32 V0 L17 20 L34 0 V32"/>
    </g>
  </g>
</svg>
