name: Build native platform wheel

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      os-name:
        type: string
        required: true
      arch:
        type: string
        required: true
      build:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      reuse-native:
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIP_ONLY_BINARY: apsw

jobs:
  native-wheel:
    name: ${{ inputs.os-name }} native cp311-abi3 wheel
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ runner.os == 'Windows' && 'x64' || '' }}
      - name: Install build tools
        run: python -m pip install cibuildwheel==4.3.0 build twine
      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean
      - name: Build native source distribution
        if: runner.os == 'Linux'
        run: python -m build native --sdist --outdir dist
      # cibuildwheel repairs Linux wheels with auditwheel and audits abi3.
      # An ordinary ubuntu linux_x86_64 wheel is not a publication artifact.
      - name: Build and repair native platform wheel
        if: ${{ !inputs.reuse-native }}
        env:
          CIBW_BUILD: ${{ inputs.build }}
          CIBW_ARCHS: ${{ inputs.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        run: python -m cibuildwheel native --output-dir dist
      - name: Fetch the exact published native wheel for this platform
        if: inputs.reuse-native
        run: >-
          python scripts/release.py fetch-native
          --platform ${{ inputs.artifact-name }} --outdir dist
      - name: Check native metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/*
          if-no-files-found: error
