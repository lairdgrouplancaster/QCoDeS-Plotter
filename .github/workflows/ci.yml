name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis tools
        run: |
          python -m pip install -U pip
          python -m pip install -e . "mypy>=1.14,<2.0" "ruff>=0.8"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

  checks:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} (${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python-version: "3.11"
            suite: full
          - os: windows-2025
            python-version: "3.12"
            suite: compatibility
          - os: windows-2025
            python-version: "3.13"
            suite: compatibility
          - os: windows-2025
            python-version: "3.14"
            suite: full
          - os: macos-latest
            python-version: "3.11"
            suite: full
          - os: macos-latest
            python-version: "3.12"
            suite: compatibility
          - os: macos-latest
            python-version: "3.13"
            suite: compatibility
          - os: macos-latest
            python-version: "3.14"
            suite: full

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pytestTemp = (Join-Path $env:RUNNER_TEMP "pytest").Replace("\", "/")
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "PYTEST_ADDOPTS=--basetemp=$pytestTemp" >> $env:GITHUB_ENV

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e . "pytest>=8.0" "pytest-cov>=6.0" "pytest-timeout>=2.3"

      - name: Run full test suite
        if: matrix.suite == 'full'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python -m pytest --no-cov
          --timeout=90 --timeout-method=thread --durations=20

      - name: Run compatibility test suite
        if: matrix.suite == 'compatibility'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python -m pytest --no-cov --maxfail=1
          --timeout=90 --timeout-method=thread --durations=20
          tests/datahandling/test_readonly.py
          tests/windows/test_heatmap_layer_integration.py
          tests/windows/test_plot_integration.py::test_main_window_opens_real_1d_and_2d_plots

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e . "pytest>=8.0" "pytest-cov>=6.0"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Run tests with coverage
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest

  package:
    name: Package artifacts
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate artifact contents and testability
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/validate_distribution.py dist

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qplot-distributions
          path: dist/*

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [static-analysis, checks, coverage, package]
    if: always()

    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "Static analysis failed."
            exit 1
          fi
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "One or more matrix checks failed."
            exit 1
          fi
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage tests failed."
            exit 1
          fi
          if [ "${{ needs.package.result }}" != "success" ]; then
            echo "Package build failed."
            exit 1
          fi
          echo "All matrix checks passed."
