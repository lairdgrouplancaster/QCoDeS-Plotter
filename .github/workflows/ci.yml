name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_ONLY_BINARY: apsw

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis tools
        run: |
          python -m pip install -U pip
          python -m pip install -e . "mypy>=1.14,<2.0" "ruff>=0.8"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

  checks:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} (${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python-version: "3.11"
            suite: full
          - os: windows-2025
            python-version: "3.12"
            suite: compatibility
          - os: windows-2025
            python-version: "3.13"
            suite: compatibility
          - os: windows-2025
            python-version: "3.14"
            suite: full
          - os: macos-latest
            python-version: "3.11"
            suite: full
          - os: macos-latest
            python-version: "3.12"
            suite: compatibility
          - os: macos-latest
            python-version: "3.13"
            suite: compatibility
          - os: macos-latest
            python-version: "3.14"
            suite: full

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: "auto"
          cache-dependency-glob: |
            pyproject.toml
            .github/workflows/ci.yml
          cache-local-path: ${{ runner.tool_cache }}/uv-cache
          prune-cache: ${{ runner.os == 'Windows' && matrix.python-version == '3.11' }}

      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $standardTemp = Join-Path $env:RUNNER_TEMP "qplot-standard-user"
          $pytestTemp = (Join-Path $standardTemp "pytest").Replace("\", "/")
          New-Item -ItemType Directory -Force -Path $standardTemp | Out-Null
          "QPLOT_UNPRIVILEGED_TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TMP=$standardTemp" >> $env:GITHUB_ENV
          "TMPDIR=$standardTemp" >> $env:GITHUB_ENV
          "PYTEST_ADDOPTS=--basetemp=$pytestTemp" >> $env:GITHUB_ENV

      - name: Require the pinned APSW platform wheel
        run: >-
          uv pip install --system --only-binary apsw apsw==3.53.4.0

      - name: Install package and test tools
        if: runner.os != 'Windows' || matrix.suite != 'full'
        run: >-
          uv pip install --system -e .
          "pytest>=8.0" "pytest-cov>=6.0" "pytest-timeout>=2.3"

      - name: Install package and Windows parallel test tools
        if: runner.os == 'Windows' && matrix.suite == 'full'
        run: >-
          uv pip install --system -e .
          "pytest>=8.0" "pytest-cov>=6.0" "pytest-timeout>=2.3"
          "pytest-xdist>=3.8"

      - name: Verify the elevated Windows runner is rejected
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "The GitHub-hosted windows-2025 runner is not elevated as expected."
          }
          $guardCode = @'
          import tempfile
          from pathlib import Path

          import apsw

          from qplot.datahandling.trusted_live import (
              TrustedLiveReader,
              TrustedLiveReaderUnavailableError,
          )

          with tempfile.TemporaryDirectory(prefix="qplot-elevated-guard-") as root:
              database = Path(root) / "guard.db"
              writer = apsw.Connection(str(database))
              writer.execute("PRAGMA journal_mode = WAL")
              writer.execute("CREATE TABLE guard (value INTEGER NOT NULL)")
              writer.execute("INSERT INTO guard VALUES (1)")
              try:
                  try:
                      TrustedLiveReader.open(database)
                  except TrustedLiveReaderUnavailableError as error:
                      messages = []
                      current = error
                      while current is not None:
                          messages.append(str(current))
                          current = current.__cause__
                      if "refuses elevated Windows tokens" not in " ".join(messages):
                          raise AssertionError(
                              "trusted reader failed for an unexpected reason: "
                              + " | ".join(messages)
                          ) from error
                  else:
                      raise AssertionError(
                          "trusted reader accepted the elevated Windows runner token"
                      )
              finally:
                  writer.close()
          '@
          python -c $guardCode

      - name: Verify unprivileged Windows deadline containment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & "$env:GITHUB_WORKSPACE\.github\scripts\check-unprivileged-windows-deadline.ps1" `
            -FilePath $python

      - name: Run full test suite
        if: matrix.suite == 'full' && runner.os != 'Windows'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python -m pytest --no-cov
          --timeout=90 --timeout-method=thread --durations=20

      # Keep each Qt/QCoDeS test file in one process, and cap Windows disk and
      # thread-pool contention at two workers. The trusted VFS intentionally
      # rejects the hosted runner's elevated token, so run the suite through a
      # disposable local account that belongs only to the standard Users group.
      - name: Run full test suite as a standard Windows user
        if: matrix.suite == 'full' && runner.os == 'Windows'
        shell: pwsh
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/qplot-standard-user/matplotlib
        run: |
          $python = (Get-Command python).Source
          $arguments = @(
            "-m", "pytest", "--no-cov",
            "-n", "2", "--dist=loadfile",
            "--timeout=90", "--timeout-method=thread", "--durations=20"
          )
          & "$env:GITHUB_WORKSPACE\.github\scripts\invoke-bounded-unprivileged-windows.ps1" `
            -FilePath $python `
            -ArgumentList $arguments

      - name: Run compatibility test suite
        if: matrix.suite == 'compatibility' && runner.os != 'Windows'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python -m pytest --no-cov --maxfail=1
          --timeout=90 --timeout-method=thread --durations=20
          tests/datahandling/test_read_sql.py
          tests/datahandling/test_readonly.py
          tests/datahandling/test_trusted_live.py
          tests/datahandling/test_trusted_live_partial_frames.py
          tests/datahandling/test_trusted_live_protocol.py
          tests/datahandling/test_trusted_live_queries.py
          tests/datahandling/test_trusted_live_result_limits.py
          tests/datahandling/test_trusted_live_service.py
          tests/datahandling/test_trusted_live_stage4_integration.py
          tests/datahandling/test_trusted_live_supervisor.py
          tests/datahandling/test_trusted_live_worker_integration.py
          tests/datahandling/test_trusted_presentation.py
          tests/datahandling/test_trusted_snapshot.py
          tests/widgets/test_run_details.py
          tests/windows/test_bounded_shutdown.py
          tests/windows/test_heatmap_layer_integration.py
          tests/windows/test_plot_integration.py::test_main_window_opens_real_1d_and_2d_plots
          tests/windows/test_trusted_live_ui.py

      - name: Run compatibility test suite as a standard Windows user
        if: matrix.suite == 'compatibility' && runner.os == 'Windows'
        shell: pwsh
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/qplot-standard-user/matplotlib
        run: |
          $python = (Get-Command python).Source
          $arguments = @(
            "-m", "pytest", "--no-cov", "--maxfail=1",
            "--timeout=90", "--timeout-method=thread", "--durations=20",
            "tests/datahandling/test_read_sql.py",
            "tests/datahandling/test_readonly.py",
            "tests/datahandling/test_trusted_live.py",
            "tests/datahandling/test_trusted_live_partial_frames.py",
            "tests/datahandling/test_trusted_live_protocol.py",
            "tests/datahandling/test_trusted_live_queries.py",
            "tests/datahandling/test_trusted_live_result_limits.py",
            "tests/datahandling/test_trusted_live_service.py",
            "tests/datahandling/test_trusted_live_stage4_integration.py",
            "tests/datahandling/test_trusted_live_supervisor.py",
            "tests/datahandling/test_trusted_live_worker_integration.py",
            "tests/datahandling/test_trusted_presentation.py",
            "tests/datahandling/test_trusted_snapshot.py",
            "tests/widgets/test_run_details.py",
            "tests/windows/test_bounded_shutdown.py",
            "tests/windows/test_heatmap_layer_integration.py",
            "tests/windows/test_plot_integration.py::test_main_window_opens_real_1d_and_2d_plots",
            "tests/windows/test_trusted_live_ui.py"
          )
          & "$env:GITHUB_WORKSPACE\.github\scripts\invoke-bounded-unprivileged-windows.ps1" `
            -FilePath $python `
            -ArgumentList $arguments

      - name: Publish bounded Windows source-test diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @("child-stdout.txt", "child-stderr.txt")) {
            $path = Join-Path $env:QPLOT_UNPRIVILEGED_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Write-Host "===== $name ====="
              try {
                [Console]::Out.Write([System.IO.File]::ReadAllText($path))
              } catch {
                Write-Warning "Could not publish '$path': $_"
              }
            }
          }

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e . "pytest>=8.0" "pytest-cov>=6.0"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Run tests with coverage
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest

  package:
    name: Linux package artifacts
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools and verify the pinned APSW wheel
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m pip install --only-binary apsw apsw==3.53.4.0

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate artifact contents and testability
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/validate_distribution.py dist

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qplot-distributions-linux
          path: dist/*

  platform-wheels:
    name: ${{ matrix.os-name }} installed wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macOS ARM64
            artifact-name: qplot-wheel-macos-arm64
          - os: macos-15-intel
            os-name: macOS Intel
            artifact-name: qplot-wheel-macos-intel
          - os: windows-2025
            os-name: Windows
            artifact-name: qplot-wheel-windows

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $standardTemp = Join-Path $env:RUNNER_TEMP "qplot-standard-user"
          New-Item -ItemType Directory -Force -Path $standardTemp | Out-Null
          "QPLOT_UNPRIVILEGED_TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TMP=$standardTemp" >> $env:GITHUB_ENV
          "TMPDIR=$standardTemp" >> $env:GITHUB_ENV

      - name: Install packaging tools and verify the pinned APSW wheel
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m pip install --only-binary apsw apsw==3.53.4.0

      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean

      - name: Build platform wheel from source
        run: python -m build --wheel

      - name: Validate and exercise the installed wheel
        if: runner.os != 'Windows'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/validate_distribution.py --wheel-only dist

      - name: Validate the installed wheel as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/qplot-standard-user/matplotlib
        run: |
          $python = (Get-Command python).Source
          $arguments = @(
            "scripts/validate_distribution.py", "--wheel-only", "dist"
          )
          & "$env:GITHUB_WORKSPACE\.github\scripts\run-unprivileged-windows.ps1" `
            -FilePath $python `
            -ArgumentList $arguments

      - name: Check wheel metadata
        run: python -m twine check dist/*

      - name: Upload platform wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*.whl

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [static-analysis, checks, coverage, package, platform-wheels]
    if: always()

    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "Static analysis failed."
            exit 1
          fi
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "One or more matrix checks failed."
            exit 1
          fi
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage tests failed."
            exit 1
          fi
          if [ "${{ needs.package.result }}" != "success" ]; then
            echo "Package build failed."
            exit 1
          fi
          if [ "${{ needs.platform-wheels.result }}" != "success" ]; then
            echo "One or more platform wheel builds failed."
            exit 1
          fi
          echo "All matrix checks passed."
