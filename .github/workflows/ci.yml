name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_ONLY_BINARY: apsw

jobs:
  application-artifacts:
    name: Pure-Python application artifacts (build once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean
      - name: Build application sdist and wheel
        env:
          CC: /nonexistent-qplot-compiler
          CXX: /nonexistent-qplot-compiler
        run: python -m build --outdir dist
      - name: Check application metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: qplot-application
          path: dist/*
          if-no-files-found: error

  native-wheels:
    name: ${{ matrix.os-name }} native cp311-abi3 wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux x86_64 manylinux
            arch: x86_64
            build: cp311-manylinux_x86_64
            artifact-name: qplot-native-linux-x86_64
          - os: macos-latest
            os-name: macOS ARM64
            arch: arm64
            build: cp311-macosx_arm64
            artifact-name: qplot-native-macos-arm64
          - os: macos-15-intel
            os-name: macOS Intel
            arch: x86_64
            build: cp311-macosx_x86_64
            artifact-name: qplot-native-macos-intel
          - os: windows-2025
            os-name: Windows x64
            arch: AMD64
            build: cp311-win_amd64
            artifact-name: qplot-native-windows-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ runner.os == 'Windows' && 'x64' || '' }}
      - name: Install build tools
        run: python -m pip install cibuildwheel==4.3.0 build twine
      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean
      - name: Build native source distribution
        if: runner.os == 'Linux'
        run: python -m build native --sdist --outdir dist
      # cibuildwheel repairs Linux wheels with auditwheel and audits abi3.
      # An ordinary ubuntu linux_x86_64 wheel is not a publication artifact.
      - name: Build and repair native platform wheel
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        run: python -m cibuildwheel native --output-dir dist
      - name: Check native metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*
          if-no-files-found: error

  static-analysis:
    name: Static analysis
    needs: [application-artifacts, native-wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-native-linux-x86_64
          path: dist

      - name: Install analysis tools
        run: |
          python -m pip install -U pip
          python scripts/validate_distribution.py --install-only --with-dev-tools dist

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

  checks:
    needs: [application-artifacts, native-wheels]
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} (${{ matrix.suite }}${{ matrix.partition && format(' {0}', matrix.partition) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python-version: "3.11"
            suite: full
            partition: "1/2"
            native-artifact: qplot-native-windows-x64
          - os: windows-2025
            python-version: "3.11"
            suite: full
            partition: "2/2"
            native-artifact: qplot-native-windows-x64
          - os: windows-2025
            python-version: "3.12"
            suite: compatibility
            native-artifact: qplot-native-windows-x64
          - os: windows-2025
            python-version: "3.13"
            suite: compatibility
            native-artifact: qplot-native-windows-x64
          - os: windows-2025
            python-version: "3.14"
            suite: full
            partition: "1/2"
            native-artifact: qplot-native-windows-x64
          - os: windows-2025
            python-version: "3.14"
            suite: full
            partition: "2/2"
            native-artifact: qplot-native-windows-x64
          - os: macos-latest
            python-version: "3.11"
            suite: full
            partition: "1/2"
            native-artifact: qplot-native-macos-arm64
          - os: macos-latest
            python-version: "3.11"
            suite: full
            partition: "2/2"
            native-artifact: qplot-native-macos-arm64
          - os: macos-latest
            python-version: "3.12"
            suite: compatibility
            native-artifact: qplot-native-macos-arm64
          - os: macos-latest
            python-version: "3.13"
            suite: compatibility
            native-artifact: qplot-native-macos-arm64
          - os: macos-latest
            python-version: "3.14"
            suite: full
            partition: "1/2"
            native-artifact: qplot-native-macos-arm64
          - os: macos-latest
            python-version: "3.14"
            suite: full
            partition: "2/2"
            native-artifact: qplot-native-macos-arm64
          - os: macos-15-intel
            python-version: "3.11"
            suite: compatibility
            native-artifact: qplot-native-macos-intel
          - os: macos-15-intel
            python-version: "3.12"
            suite: compatibility
            native-artifact: qplot-native-macos-intel
          - os: macos-15-intel
            python-version: "3.13"
            suite: compatibility
            native-artifact: qplot-native-macos-intel
          - os: macos-15-intel
            python-version: "3.14"
            suite: compatibility
            native-artifact: qplot-native-macos-intel
          - os: ubuntu-latest
            python-version: "3.11"
            suite: compatibility
            native-artifact: qplot-native-linux-x86_64
          - os: ubuntu-latest
            python-version: "3.13"
            suite: compatibility
            native-artifact: qplot-native-linux-x86_64

    env:
      QT_QPA_PLATFORM: offscreen
      QPLOT_CI_WHEEL_AUDIT: ${{ github.workspace }}/dist/wheel-installation-audit.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: "auto"
          # Reuse downloaded packages across unrelated workflow edits;
          # uv still resolves and installs the requested tool versions below.
          cache-dependency-glob: "**/pyproject.toml"
          cache-local-path: ${{ runner.tool_cache }}/uv-cache
          # Keep downloaded wheels available for subsequent CI runs.
          prune-cache: false

      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $standardTemp = Join-Path $env:RUNNER_TEMP "qplot-standard-user"
          $pytestTemp = (Join-Path $standardTemp "pytest").Replace("\", "/")
          New-Item -ItemType Directory -Force -Path $standardTemp | Out-Null
          "QPLOT_UNPRIVILEGED_TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TMP=$standardTemp" >> $env:GITHUB_ENV
          "TMPDIR=$standardTemp" >> $env:GITHUB_ENV
          "PYTEST_ADDOPTS=--basetemp=$pytestTemp" >> $env:GITHUB_ENV
          "QPLOT_CI_PHASE_LOG_PATH=$(Join-Path $standardTemp 'wrapper-phase.txt')" >> $env:GITHUB_ENV

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native-artifact }}
          path: dist

      - name: Require the pinned APSW platform wheel
        run: >-
          uv pip install --system --only-binary apsw apsw==3.53.4.0

      - name: Install package and test tools
        run: >-
          python scripts/validate_distribution.py --install-only --with-dev-tools
          --audit-path dist/wheel-installation-audit.py dist

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Verify the elevated Windows runner is rejected
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "The GitHub-hosted windows-2025 runner is not elevated as expected."
          }
          $guardCode = @'
          import tempfile
          from pathlib import Path

          import apsw

          from qplot.datahandling.trusted_live import (
              TrustedLiveReader,
              TrustedLiveReaderUnavailableError,
          )

          with tempfile.TemporaryDirectory(prefix="qplot-elevated-guard-") as root:
              database = Path(root) / "guard.db"
              writer = apsw.Connection(str(database))
              writer.execute("PRAGMA journal_mode = WAL")
              writer.execute("CREATE TABLE guard (value INTEGER NOT NULL)")
              writer.execute("INSERT INTO guard VALUES (1)")
              try:
                  try:
                      TrustedLiveReader.open(database)
                  except TrustedLiveReaderUnavailableError as error:
                      messages = []
                      current = error
                      while current is not None:
                          messages.append(str(current))
                          current = current.__cause__
                      if "refuses elevated Windows tokens" not in " ".join(messages):
                          raise AssertionError(
                              "trusted reader failed for an unexpected reason: "
                              + " | ".join(messages)
                          ) from error
                  else:
                      raise AssertionError(
                          "trusted reader accepted the elevated Windows runner token"
                      )
              finally:
                  writer.close()
          '@
          python -c $guardCode

      - name: Verify unprivileged Windows deadline containment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & "$env:GITHUB_WORKSPACE\.github\scripts\check-unprivileged-windows-deadline.ps1" `
            -FilePath $python

      # Keep each Qt/QCoDeS test file in one process, and cap disk and
      # thread-pool contention at two workers across all source suites.
      # Full suites use the collection order from tests._ci_scheduling so
      # slow integration files start before the short unit-test files.
      - name: Run partitioned full test suite
        if: matrix.suite == 'full' && runner.os != 'Windows' && matrix.partition
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python -m pytest -o pythonpath= --no-cov -n 2 --dist=loadfile
          --no-loadscope-reorder
          --qplot-ci-partition=${{ matrix.partition }}
          --timeout=90 --timeout-method=thread --durations=20 -v

      # The trusted VFS intentionally rejects the hosted runner's elevated
      # token, so run the Windows suites through a disposable local account
      # that belongs only to the standard Users group.
      - name: Run full test suite as a standard Windows user
        if: matrix.suite == 'full' && runner.os == 'Windows'
        shell: pwsh
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/qplot-standard-user/matplotlib
        run: |
          $python = (Get-Command python).Source
          $arguments = @(
            "-m", "pytest", "-o", "pythonpath=", "--no-cov",
            "-n", "2", "--dist=loadfile",
            "--no-loadscope-reorder",
            "--qplot-ci-partition=${{ matrix.partition }}",
            "--timeout=90", "--timeout-method=thread", "--durations=20", "-v"
          )
          # Two disjoint whole-file partitions retain the complete suite while
          # fitting its growing workload into a bounded budget.
          # Each partition keeps two workers, 90-second individual tests and
          # 25 minutes total, plus two-minute cleanup within the 30-minute job.
          & "$env:GITHUB_WORKSPACE\.github\scripts\invoke-bounded-unprivileged-windows.ps1" `
            -FilePath $python `
            -ArgumentList $arguments `
            -TimeoutSeconds 1500

      # Share the test list through a pytest argument file to stay below the
      # Windows standard-user launcher's 1024-character command-line limit.
      - name: Run compatibility test suite
        if: matrix.suite == 'compatibility' && runner.os != 'Windows'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python -m pytest -o pythonpath= --no-cov --maxfail=1 -n 2 --dist=loadfile
          --timeout=90 --timeout-method=thread --durations=20
          @.github/pytest-compatibility.txt

      - name: Run compatibility test suite as a standard Windows user
        if: matrix.suite == 'compatibility' && runner.os == 'Windows'
        shell: pwsh
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/qplot-standard-user/matplotlib
        run: |
          $python = (Get-Command python).Source
          $arguments = @(
            "-m", "pytest", "-o", "pythonpath=", "--no-cov", "--maxfail=1",
            "-n", "2", "--dist=loadfile",
            "--timeout=90", "--timeout-method=thread", "--durations=20",
            "@.github/pytest-compatibility.txt"
          )
          & "$env:GITHUB_WORKSPACE\.github\scripts\invoke-bounded-unprivileged-windows.ps1" `
            -FilePath $python `
            -ArgumentList $arguments

      - name: Publish bounded Windows source-test diagnostics
        # Successful runs include pytest's duration report in child stdout.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          function Write-BoundedLogTail {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Path,
              [int] $MaximumBytes = 32768
            )
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return
            }
            Write-Host "===== $([System.IO.Path]::GetFileName($Path)) ====="
            $stream = $null
            try {
              $stream = [System.IO.File]::Open(
                $Path,
                [System.IO.FileMode]::Open,
                [System.IO.FileAccess]::Read,
                [System.IO.FileShare]::ReadWrite
              )
              $length = [int] [Math]::Min($stream.Length, $MaximumBytes)
              if ($stream.Length -gt $length) {
                Write-Host "[truncated to the final $length bytes]"
              }
              [void] $stream.Seek(-$length, [System.IO.SeekOrigin]::End)
              $buffer = [byte[]]::new($length)
              $totalRead = 0
              while ($totalRead -lt $length) {
                $read = $stream.Read(
                  $buffer,
                  $totalRead,
                  $length - $totalRead
                )
                if ($read -eq 0) {
                  break
                }
                $totalRead += $read
              }
              [Console]::Out.Write(
                [System.Text.Encoding]::UTF8.GetString(
                  $buffer,
                  0,
                  $totalRead
                )
              )
            } catch {
              Write-Warning "Could not publish '$Path': $_"
            } finally {
              if ($null -ne $stream) {
                $stream.Dispose()
              }
            }
          }
          foreach ($name in @(
            "wrapper-phase.txt",
            "child-stdout.txt",
            "child-stderr.txt"
          )) {
            $path = Join-Path $env:QPLOT_UNPRIVILEGED_TEMP $name
            Write-BoundedLogTail -Path $path
          }

  coverage:
    needs: [application-artifacts, native-wheels]
    name: Coverage
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      QPLOT_CI_WHEEL_AUDIT: ${{ github.workspace }}/dist/wheel-installation-audit.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Python 3.14 supports low-overhead sys.monitoring branch coverage.
          python-version: "3.14"
          cache: pip

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-native-linux-x86_64
          path: dist

      - name: Install package
        run: |
          python -m pip install -U pip
          python scripts/validate_distribution.py --install-only --with-dev-tools --extra-requirement "coverage>=7.12" --audit-path dist/wheel-installation-audit.py dist

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Run tests with coverage
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest -o pythonpath= -n 2 --dist=loadfile --no-loadscope-reorder

  package:
    needs: [application-artifacts, native-wheels]
    name: Linux source and installed manylinux validation
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools and verify the pinned APSW wheel
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m pip install --only-binary apsw apsw==3.53.4.0

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-native-linux-x86_64
          path: dist

      - name: Validate artifact contents and testability
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/validate_distribution.py dist

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qplot-distributions-linux
          path: dist/*

  platform-wheels:
    name: ${{ matrix.os-name }} installed wheels Python ${{ matrix.python-version }}
    needs: [application-artifacts, native-wheels]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, macos-arm64, macos-intel, windows-x64]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - platform: linux-x86_64
            os-name: Linux x86_64
            os: ubuntu-latest
            native-artifact: qplot-native-linux-x86_64
          - platform: macos-arm64
            os-name: macOS ARM64
            os: macos-latest
            native-artifact: qplot-native-macos-arm64
          - platform: macos-intel
            os-name: macOS Intel
            os: macos-15-intel
            native-artifact: qplot-native-macos-intel
          - platform: windows-x64
            os-name: Windows x64
            os: windows-2025
            native-artifact: qplot-native-windows-x64

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $standardTemp = Join-Path $env:RUNNER_TEMP "qplot-standard-user"
          New-Item -ItemType Directory -Force -Path $standardTemp | Out-Null
          "QPLOT_UNPRIVILEGED_TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TEMP=$standardTemp" >> $env:GITHUB_ENV
          "TMP=$standardTemp" >> $env:GITHUB_ENV
          "TMPDIR=$standardTemp" >> $env:GITHUB_ENV

      - name: Install packaging tools and verify the pinned APSW wheel
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m pip install --only-binary apsw apsw==3.53.4.0

      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplot-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native-artifact }}
          path: dist
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1

      - name: Validate and exercise the installed wheel
        if: runner.os != 'Windows'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/validate_distribution.py --wheel-only dist

      - name: Validate the installed wheel as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/qplot-standard-user/matplotlib
        run: |
          $python = (Get-Command python).Source
          $arguments = @(
            "scripts/validate_distribution.py", "--wheel-only", "dist"
          )
          & "$env:GITHUB_WORKSPACE\.github\scripts\run-unprivileged-windows.ps1" `
            -FilePath $python `
            -ArgumentList $arguments

      - name: Upload Windows wheel failure diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: qplot-wheel-windows-${{ matrix.python-version }}-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ env.QPLOT_UNPRIVILEGED_TEMP }}/child-stdout.txt
            ${{ env.QPLOT_UNPRIVILEGED_TEMP }}/child-stderr.txt

      - name: Check wheel metadata
        run: python -m twine check dist/*

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [application-artifacts, native-wheels, static-analysis, checks, coverage, package, platform-wheels]
    if: always()

    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.application-artifacts.result }}" != "success" ] || [ "${{ needs.native-wheels.result }}" != "success" ]; then
            echo "Application or native artifact build failed."
            exit 1
          fi
          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "Static analysis failed."
            exit 1
          fi
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "One or more matrix checks failed."
            exit 1
          fi
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage tests failed."
            exit 1
          fi
          if [ "${{ needs.package.result }}" != "success" ]; then
            echo "Package build failed."
            exit 1
          fi
          if [ "${{ needs.platform-wheels.result }}" != "success" ]; then
            echo "One or more platform wheel builds failed."
            exit 1
          fi
          echo "All matrix checks passed."
