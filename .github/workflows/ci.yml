name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full-validation:
        description: Include full Python matrix, Linux tests, coverage and source-distribution validation
        type: boolean
        default: true
  workflow_call:
    inputs:
      full-validation:
        description: Run the full Python matrix, Linux tests, coverage and source-distribution validation
        type: boolean
        default: true
      reuse-native:
        description: Validate with the pinned native wheels already published on PyPI
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_ONLY_BINARY: apsw

jobs:
  ci-plan:
    name: Choose validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full-validation: ${{ steps.plan.outputs.full-validation }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Choose routine or full validation
        id: plan
        env:
          QPLOT_FULL_VALIDATION: ${{ inputs.full-validation || false }}
        run: python .github/scripts/ci_plan.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"
      - name: Run Ruff
        run: python -m ruff check .

  application-artifacts:
    name: Pure-Python application artifacts (build once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean
      - name: Record application build provenance
        run: python scripts/write_build_info.py
      - name: Build application sdist and wheel
        env:
          CC: /nonexistent-qplot-compiler
          CXX: /nonexistent-qplot-compiler
        run: python -m build --outdir dist
      - name: Check application metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: qplotter-application
          path: dist/*
          if-no-files-found: error

  # Explicit jobs let each platform proceed without waiting for another runner.
  native-linux:
    uses: ./.github/workflows/ci-native.yml
    with:
      os: ubuntu-latest
      os-name: Linux x86_64 manylinux
      arch: x86_64
      build: cp311-manylinux_x86_64
      artifact-name: qplotter-native-linux-x86_64
      reuse-native: ${{ inputs.reuse-native || false }}

  native-windows:
    uses: ./.github/workflows/ci-native.yml
    with:
      os: windows-2025
      os-name: Windows x64
      arch: AMD64
      build: cp311-win_amd64
      artifact-name: qplotter-native-windows-x64
      reuse-native: ${{ inputs.reuse-native || false }}

  native-macos-arm64:
    uses: ./.github/workflows/ci-native.yml
    with:
      os: macos-latest
      os-name: macOS ARM64
      arch: arm64
      build: cp311-macosx_arm64
      artifact-name: qplotter-native-macos-arm64
      reuse-native: ${{ inputs.reuse-native || false }}

  native-macos-intel:
    uses: ./.github/workflows/ci-native.yml
    with:
      os: macos-15-intel
      os-name: macOS Intel
      arch: x86_64
      build: cp311-macosx_x86_64
      artifact-name: qplotter-native-macos-intel
      reuse-native: ${{ inputs.reuse-native || false }}

  platform-linux:
    needs: [ci-plan, application-artifacts, native-linux]
    if: needs.ci-plan.outputs.full-validation == 'true'
    uses: ./.github/workflows/ci-platform.yml
    with:
      checks: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['linux-x86_64'].checks) }}
      installations: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['linux-x86_64'].installations) }}

  platform-windows:
    needs: [ci-plan, application-artifacts, native-windows]
    uses: ./.github/workflows/ci-platform.yml
    with:
      checks: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['windows-x64'].checks) }}
      installations: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['windows-x64'].installations) }}

  platform-macos-arm64:
    needs: [ci-plan, application-artifacts, native-macos-arm64]
    uses: ./.github/workflows/ci-platform.yml
    with:
      checks: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['macos-arm64'].checks) }}
      installations: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['macos-arm64'].installations) }}

  platform-macos-intel:
    needs: [ci-plan, application-artifacts, native-macos-intel]
    uses: ./.github/workflows/ci-platform.yml
    with:
      checks: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['macos-intel'].checks) }}
      installations: ${{ toJSON(fromJSON(needs.ci-plan.outputs.platforms)['macos-intel'].installations) }}

  static-analysis:
    name: Static analysis
    needs: [application-artifacts, native-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplotter-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplotter-native-linux-x86_64
          path: dist

      - name: Install analysis tools
        run: |
          python -m pip install -U pip
          python scripts/validate_distribution.py --install-only --with-dev-tools dist
          # 6.12.0 has malformed signatures; 6.12.1 mis-types QObject parents
          # and requires pyqtSignal's optional arguments keyword. Use the
          # validated stubs for analysis only; runtime tests use latest Qt.
          python -m pip install "PyQt6==6.11.0"

      - name: Run mypy
        run: python -m mypy

  coverage:
    needs: [ci-plan, application-artifacts, native-linux]
    if: needs.ci-plan.outputs.full-validation == 'true'
    name: Coverage (${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]

    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.${{ matrix.partition }}
      QT_QPA_PLATFORM: offscreen
      QPLOT_CI_WHEEL_AUDIT: ${{ github.workspace }}/dist/wheel-installation-audit.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Python 3.14 supports low-overhead sys.monitoring branch coverage.
          python-version: "3.14"
          cache: pip

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplotter-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplotter-native-linux-x86_64
          path: dist

      - name: Install package
        run: |
          python -m pip install -U pip
          python scripts/validate_distribution.py --install-only --with-dev-tools --extra-requirement "coverage>=7.12" --audit-path dist/wheel-installation-audit.py dist

      - name: Install Qt system libraries
        timeout-minutes: 5
        run: |
          # Hosted runners normally include libegl1. Avoid an unrelated mirror
          # outage blocking tests when the dependency is already available.
          if [ "$(dpkg-query -W -f='${Status}' libegl1 2>/dev/null)" = "install ok installed" ]; then
            echo "libegl1 is already installed."
            exit 0
          fi
          sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --yes --no-install-recommends libegl1

      - name: Run tests with coverage
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python -m pytest -o pythonpath= -n 2 --dist=loadfile --no-loadscope-reorder
          --qplot-ci-partition=${{ matrix.partition }}/2
          --cov=qplot --cov-report=

      - name: Upload coverage partition
        uses: actions/upload-artifact@v4
        with:
          name: qplot-coverage-${{ matrix.partition }}
          path: .coverage.${{ matrix.partition }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-report:
    name: Combined coverage
    needs: [ci-plan, coverage]
    if: needs.ci-plan.outputs.full-validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install coverage tools
        run: python -m pip install "coverage>=7.12"
      - name: Download first coverage partition
        uses: actions/download-artifact@v4
        with:
          name: qplot-coverage-1
      - name: Download second coverage partition
        uses: actions/download-artifact@v4
        with:
          name: qplot-coverage-2
      - name: Combine both complete partitions
        run: |
          test -s .coverage.1
          test -s .coverage.2
          python -m coverage combine --rcfile=.github/coverage-combine.toml .coverage.1 .coverage.2
          python -m coverage report --skip-covered
          python -m coverage xml
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: qplot-coverage-report
          path: coverage.xml
          if-no-files-found: error

  package:
    needs: [ci-plan, application-artifacts, native-linux]
    if: needs.ci-plan.outputs.full-validation == 'true'
    name: Linux source and installed manylinux validation (${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools and verify the pinned APSW wheel
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m pip install --only-binary apsw apsw==3.53.4.0

      - name: Install Qt system libraries
        timeout-minutes: 5
        run: |
          # Hosted runners normally include libegl1. Avoid an unrelated mirror
          # outage blocking tests when the dependency is already available.
          if [ "$(dpkg-query -W -f='${Status}' libegl1 2>/dev/null)" = "install ok installed" ]; then
            echo "libegl1 is already installed."
            exit 0
          fi
          sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --yes --no-install-recommends libegl1

      - name: Verify clean source tree
        run: python scripts/validate_distribution.py --check-clean

      # download-artifact defaults to this workflow run, including PR merge SHA.
      - name: Download application artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplotter-application
          path: dist
      - name: Download matching native artifacts from this revision
        uses: actions/download-artifact@v4
        with:
          name: qplotter-native-linux-x86_64
          path: dist

      - name: Validate artifact contents and testability
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python scripts/validate_distribution.py --test-partition ${{ matrix.partition }}/2 dist

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload package artifacts
        if: matrix.partition == 1
        uses: actions/upload-artifact@v4
        with:
          name: qplot-distributions-linux
          path: dist/*

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [lint, ci-plan, application-artifacts, native-linux, native-windows, native-macos-arm64, native-macos-intel, static-analysis, platform-windows, platform-macos-arm64, platform-macos-intel, platform-linux, coverage, coverage-report, package]
    if: always()

    steps:
      - name: Check matrix result
        run: |
          case "${{ needs.ci-plan.outputs.full-validation }}" in
            true) expected_full_result=success ;;
            false) expected_full_result=skipped ;;
            *) echo "Missing or invalid validation scope."; exit 1 ;;
          esac
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Required job lint did not succeed."
            exit 1
          fi
          if [ "${{ needs.ci-plan.result }}" != "success" ]; then
            echo "Required job ci-plan did not succeed."
            exit 1
          fi
          if [ "${{ needs.application-artifacts.result }}" != "success" ]; then
            echo "Required job application-artifacts did not succeed."
            exit 1
          fi
          if [ "${{ needs.native-linux.result }}" != "success" ]; then
            echo "Required job native-linux did not succeed."
            exit 1
          fi
          if [ "${{ needs.native-windows.result }}" != "success" ]; then
            echo "Required job native-windows did not succeed."
            exit 1
          fi
          if [ "${{ needs.native-macos-arm64.result }}" != "success" ]; then
            echo "Required job native-macos-arm64 did not succeed."
            exit 1
          fi
          if [ "${{ needs.native-macos-intel.result }}" != "success" ]; then
            echo "Required job native-macos-intel did not succeed."
            exit 1
          fi
          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "Required job static-analysis did not succeed."
            exit 1
          fi
          if [ "${{ needs.platform-windows.result }}" != "success" ]; then
            echo "Required job platform-windows did not succeed."
            exit 1
          fi
          if [ "${{ needs.platform-macos-arm64.result }}" != "success" ]; then
            echo "Required job platform-macos-arm64 did not succeed."
            exit 1
          fi
          if [ "${{ needs.platform-macos-intel.result }}" != "success" ]; then
            echo "Required job platform-macos-intel did not succeed."
            exit 1
          fi
          if [ "${{ needs.platform-linux.result }}" != "$expected_full_result" ]; then
            echo "platform-linux result does not match the required validation scope."
            exit 1
          fi
          if [ "${{ needs.coverage.result }}" != "$expected_full_result" ]; then
            echo "coverage result does not match the required validation scope."
            exit 1
          fi
          if [ "${{ needs.coverage-report.result }}" != "$expected_full_result" ]; then
            echo "coverage-report result does not match the required validation scope."
            exit 1
          fi
          if [ "${{ needs.package.result }}" != "$expected_full_result" ]; then
            echo "package result does not match the required validation scope."
            exit 1
          fi
          echo "All matrix checks passed."
